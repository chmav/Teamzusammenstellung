<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Randomizer</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background: #eef2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header {
        width: 100%;
        padding: 25px 0;
        text-align: center;
        background: linear-gradient(135deg, #2c3e50, #4ca1af);
        color: white;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 30px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .container {
        width: 360px;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    }

    label {
        font-weight: 600;
        margin-bottom: 6px;
        color: #333;
    }

    .input-group {
        margin-bottom: 22px;
    }

    /* Neues stylisches Number-Input */
    .number-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .number-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 2px solid #d0d7de;
        font-size: 18px;
        text-align: center;
        font-weight: 600;
        outline: none;
        transition: 0.2s;
    }

    .number-box:focus {
        border-color: #4ca1af;
        box-shadow: 0 0 6px rgba(76,161,175,0.4);
    }

    .stepper {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .step-btn {
        width: 36px;
        height: 36px;
        background: #4ca1af;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.15s;
        font-weight: 700;
    }

    .step-btn:hover {
        background: #3b8d98;
        transform: translateY(-1px);
    }

    .step-btn:active {
        transform: scale(0.92);
    }

    /* Ergebnisbox mit leichter Animation */
    .result-box {
        margin-top: 15px;
        padding: 20px;
        background: #f7fbff;
        border: 1px solid #c9e6ff;
        border-radius: 12px;
        text-align: center;
        min-height: 50px;
        opacity: 1;
        transition: opacity 0.25s ease-out;
    }

    .fade {
        opacity: 0.2;
    }

    .team {
        display: inline-block;
        padding: 6px 10px;
        margin: 5px;
        border-radius: 6px;
        color: white;
        font-weight: 700;
        font-size: 18px;
    }
</style>
</head>

<body>

<header>Team Randomizer</header>

<div class="container">

    <div class="input-group">
        <label>Anzahl Spieler</label>
        <div class="number-wrapper">
            <input type="number" id="players" class="number-box" value="10" min="1">
            <div class="stepper">
                <button class="step-btn" onclick="step('players', 1)">▲</button>
                <button class="step-btn" onclick="step('players', -1)">▼</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>Anzahl Teams</label>
        <div class="number-wrapper">
            <input type="number" id="teams" class="number-box" value="2" min="2">
            <div class="stepper">
                <button class="step-btn" onclick="step('teams', 1)">▲</button>
                <button class="step-btn" onclick="step('teams', -1)">▼</button>
            </div>
        </div>
    </div>

    <div class="result-box" id="result">Wird generiert …</div>

</div>

<script>
// Buttons zum Hoch/Runter-Klicken
function step(field, amount) {
    let element = document.getElementById(field);
    let value = parseInt(element.value);
    let min = parseInt(element.min);

    value += amount;
    if (value < min) value = min;

    element.value = value;
    generateTeams();
}

// Zufallsfarbe ab Team D
function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

function generateTeams() {
    const resultBox = document.getElementById("result");

    // Animation einleiten
    resultBox.classList.add("fade");

    setTimeout(() => {
        const numPlayers = parseInt(document.getElementById("players").value);
        const numTeams = parseInt(document.getElementById("teams").value);

        let teamLetters = [];
        for (let i = 0; i < numTeams; i++) {
            teamLetters.push(String.fromCharCode(65 + i));
        }

        // feste Farben
        let teamColors = {
            "A": "black",
            "B": "red",
            "C": "green"
        };

        // zufällige Farben ab D
        for (let i = 3; i < numTeams; i++) {
            teamColors[String.fromCharCode(65 + i)] = getRandomColor();
        }

        let distribution = [];
        for (let i = 0; i < numPlayers; i++) {
            distribution.push(teamLetters[i % numTeams]);
        }

        // Shuffle
        for (let i = distribution.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
        }

        // HTML erzeugen
        let html = "";
        distribution.forEach(team => {
            html += `<span class="team" style="background:${teamColors[team]}">${team}</span>`;
        });

        resultBox.innerHTML = html;

        // Animation ausblenden
        resultBox.classList.remove("fade");

    }, 200); // kurze Verzögerung für Animation
}

// Listener
document.getElementById("players").addEventListener("input", generateTeams);
document.getElementById("teams").addEventListener("input", generateTeams);

// Start
generateTeams();
</script>

</body>
</html>
