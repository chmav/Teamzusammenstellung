<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UHT Hot Shots Bronschhofen - Team Randomizer</title>

<style>
    /* Grundlayout */
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Sportlicher Header */
    header {
        width: 100%;
        padding: 22px 0;
        text-align: center;
        background: linear-gradient(135deg, #000, #a00000);
        color: white;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 25px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    /* Karten-Container */
    .container {
        width: 92%;
        max-width: 420px;
        background: white;
        padding: 22px;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    label {
        font-weight: 700;
        margin-bottom: 8px;
        color: #222;
        font-size: 17px;
        display: block;
    }

    .input-group {
        margin-bottom: 24px;
    }

    /* Stylish Number-Inputs */
    .number-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .number-box {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        border: 2px solid #ccc;
        font-size: 20px;
        text-align: center;
        font-weight: 700;
        outline: none;
        transition: 0.2s;
    }

    .number-box:focus {
        border-color: #a00000;
        box-shadow: 0 0 6px rgba(160,0,0,0.4);
    }

    /* Stepper neu: Sportlicher Button-Look */
    .stepper {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .step-btn {
        width: 46px;
        height: 46px;
        background: #a00000;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.15s;
        touch-action: manipulation;
    }

    .step-btn:hover {
        background: #cc0000;
        transform: translateY(-2px);
    }

    .step-btn:active {
        transform: scale(0.92);
    }

    /* Ergebnisbox */
    .result-box {
        padding: 22px;
        background: #fff5f5;
        border: 2px solid #ffcccc;
        border-radius: 16px;
        text-align: center;
        min-height: 60px;
        opacity: 1;
        transition: opacity 0.25s ease-out;
        font-size: 20px;
    }

    .fade {
        opacity: 0.25;
    }

    /* Team-Badges rot/schwarz-orientiert */
    .team {
        display: inline-block;
        padding: 8px 12px;
        margin: 6px;
        border-radius: 6px;
        color: white;
        font-weight: 700;
        font-size: 20px;
    }

    /* Abstände für Smartphones */
    @media (max-width: 380px) {
        header {
            font-size: 22px;
        }
        .team {
            font-size: 18px;
            padding: 6px 10px;
        }
    }
</style>
</head>

<body>

<header>UHT Hot Shots Bronschhofen<br>Team Randomizer</header>

<div class="container">

    <div class="input-group">
        <label>Anzahl Spieler</label>
        <div class="number-wrapper">
            <input type="number" id="players" class="number-box" value="10" min="1">
            <div class="stepper">
                <button class="step-btn" onclick="step('players', 1)">▲</button>
                <button class="step-btn" onclick="step('players', -1)">▼</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>Anzahl Teams</label>
        <div class="number-wrapper">
            <input type="number" id="teams" class="number-box" value="2" min="2">
            <div class="stepper">
                <button class="step-btn" onclick="step('teams', 1)">▲</button>
                <button class="step-btn" onclick="step('teams', -1)">▼</button>
            </div>
        </div>
    </div>

    <div class="result-box" id="result">Wird generiert …</div>

</div>

<script>
/* Stepper-Buttons */
function step(field, amount) {
    let element = document.getElementById(field);
    let value = parseInt(element.value);
    let min = parseInt(element.min);

    value += amount;
    if (value < min) value = min;

    element.value = value;
    generateTeams();
}

/* Zufallsfarbe */
function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

/* Teams generieren */
function generateTeams() {
    const resultBox = document.getElementById("result");
    resultBox.classList.add("fade");

    setTimeout(() => {
        const numPlayers = parseInt(document.getElementById("players").value);
        const numTeams = parseInt(document.getElementById("teams").value);

        let teamLetters = [];
        for (let i = 0; i < numTeams; i++) {
            teamLetters.push(String.fromCharCode(65 + i));
        }

        /* Farbregeln (rot/schwarz Fokus) */
        let teamColors = {
            "A": "black",
            "B": "#cc0000",
            "C": "#58C66C"
        };

        for (let i = 3; i < numTeams; i++) {
            teamColors[String.fromCharCode(65 + i)] = getRandomColor();
        }

        let distribution = [];
        for (let i = 0; i < numPlayers; i++) {
            distribution.push(teamLetters[i % numTeams]);
        }

        /* Shuffle */
        for (let i = distribution.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
        }

        /* HTML erzeugen */
        let html = "";
        distribution.forEach(team => {
            html += `<span class="team" style="background:${teamColors[team]}">${team}</span>`;
        });

        resultBox.innerHTML = html;
        resultBox.classList.remove("fade");

    }, 200);
}

document.getElementById("players").addEventListener("input", generateTeams);
document.getElementById("teams").addEventListener("input", generateTeams);

generateTeams();
</script>

</body>
</html>
