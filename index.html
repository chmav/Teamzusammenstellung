<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Team Randomizer</title>

<!-- Modern font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    :root{
        --bg: #f6f8fb;
        --card: #ffffff;
        --muted: #7b8794;
        --accent: linear-gradient(135deg,#5b8cff 0%,#6be0c8 100%);
        --glass: rgba(255,255,255,0.6);
        --result-bg: #eef8ff;
        --result-border: #cfe8ff;
        --radius: 14px;
    }

    * { box-sizing: border-box; }
    html,body {
        height: 100%;
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        background: radial-gradient(1000px 600px at 10% 10%, rgba(91,140,255,0.06), transparent 8%),
                    radial-gradient(800px 400px at 90% 90%, rgba(107,224,200,0.04), transparent 8%),
                    var(--bg);
        color: #263238;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
    }

    .wrapper {
        width: 760px;
        max-width: 96%;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 24px;
        align-items: start;
    }

    .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 22px;
        box-shadow: 0 6px 30px rgba(32,41,54,0.08);
        border: 1px solid rgba(20,30,40,0.03);
    }

    .hero {
        display:flex;
        gap:16px;
        align-items:center;
    }

    .logo {
        width:64px;
        height:64px;
        border-radius:12px;
        background:var(--accent);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:700;
        font-size:22px;
        box-shadow: 0 6px 18px rgba(91,140,255,0.2);
    }

    h1 {
        margin: 0;
        font-size:20px;
        letter-spacing: -0.2px;
    }

    p.lead {
        margin:6px 0 0 0;
        color: var(--muted);
        font-size:14px;
    }

    .controls {
        margin-top:18px;
        display:flex;
        gap:12px;
        align-items:center;
        flex-wrap:wrap;
    }

    .input-group {
        background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(250,250,250,0.95));
        border-radius:10px;
        padding:8px;
        display:flex;
        align-items:center;
        gap:8px;
        min-width: 160px;
        border: 1px solid rgba(35,47,63,0.06);
    }

    .input-group label {
        display:block;
        font-size:12px;
        color:var(--muted);
        width:100%;
    }

    .number-input {
        display:flex;
        align-items:center;
        gap:8px;
        width:100%;
    }

    input[type="number"] {
        -moz-appearance: textfield;
        -webkit-appearance: none;
        appearance: none;
        border: none;
        outline: none;
        font-size:20px;
        font-weight:600;
        color:#1f2a37;
        background: transparent;
        padding: 6px 8px;
        width: 100%;
    }

    /* hide default arrows in Chrome */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .stepper {
        display:flex;
        flex-direction:column;
        border-radius:8px;
        overflow:hidden;
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.04);
    }

    .stepper button {
        background: transparent;
        border: none;
        padding:6px 8px;
        cursor: pointer;
        width:36px;
        height:28px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .stepper button:hover {
        background: rgba(0,0,0,0.05);
    }

    .stepper .plus { border-bottom: 1px solid rgba(0,0,0,0.03); }

    .aside {
        display:flex;
        flex-direction:column;
        gap:14px;
    }

    .result-box {
        margin-top: 0;
        padding: 18px;
        background: var(--result-bg);
        border: 1px solid var(--result-border);
        border-radius: 12px;
        min-height: 120px;
        font-size: 18px;
        word-wrap: break-word;
        text-align: center;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        flex-wrap:wrap;
    }

    .team {
        display: inline-flex;
        align-items:center;
        justify-content:center;
        padding: 6px 10px;
        margin: 6px;
        border-radius: 10px;
        color: white;
        font-weight: 700;
        min-width: 34px;
        min-height: 34px;
        box-shadow: 0 6px 18px rgba(20,30,40,0.06);
        font-size:16px;
    }

    .legend {
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        align-items:center;
        justify-content:center;
    }

    .legend-item {
        display:flex;
        gap:8px;
        align-items:center;
        padding:6px 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.6);
        border: 1px solid rgba(20,30,40,0.03);
        font-size:13px;
        color:var(--muted);
        min-width: 80px;
        justify-content:center;
    }

    .legend-color {
        width:18px;
        height:18px;
        border-radius:6px;
        box-shadow: inset 0 -2px 4px rgba(0,0,0,0.08);
    }

    .footer {
        margin-top:18px;
        font-size:13px;
        color:var(--muted);
        text-align:left;
    }

    /* Responsive */
    @media (max-width:820px) {
        .wrapper { grid-template-columns: 1fr; }
        .aside { order: -1; }
    }
</style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div class="hero">
            <div class="logo">TR</div>
            <div>
                <h1>Team Randomizer</h1>
                <p class="lead">Gleiche Verteilung, zufällige Zuordnung. Farben für A/B/C bleiben erhalten.</p>
            </div>
        </div>

        <div class="controls" style="margin-top:20px;">
            <div class="input-group" style="flex:1;min-width:180px;">
                <div style="width:100%;">
                    <label for="players">Anzahl Spieler</label>
                    <div class="number-input" aria-hidden="false">
                        <input id="players" type="number" value="10" min="1" step="1" aria-label="Anzahl Spieler">
                        <div class="stepper" aria-hidden="true">
                            <button type="button" class="plus" data-target="players" data-action="inc" title="Erhöhen">＋</button>
                            <button type="button" class="minus" data-target="players" data-action="dec" title="Verringern">－</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-group" style="width:220px;">
                <div style="width:100%;">
                    <label for="teams">Anzahl Teams</label>
                    <div class="number-input">
                        <input id="teams" type="number" value="2" min="2" max="26" step="1" aria-label="Anzahl Teams">
                        <div class="stepper" aria-hidden="true">
                            <button type="button" class="plus" data-target="teams" data-action="inc" title="Erhöhen">＋</button>
                            <button type="button" class="minus" data-target="teams" data-action="dec" title="Verringern">－</button>
                        </div>
                    </div>
                </div>
            </div>

            <div style="display:flex;align-items:center;gap:8px;">
                <button id="regen" style="background:var(--accent);border:none;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;box-shadow: 0 10px 30px rgba(91,140,255,0.12);">
                    Erzeugen
                </button>
                <button id="shuffle" title="Neu mischen" style="background:transparent;border:1px solid rgba(20,30,40,0.06);padding:10px 12px;border-radius:10px;cursor:pointer;">
                    Neu mischen
                </button>
            </div>
        </div>

        <div class="footer">
            Tipp: Verwende die +/- Buttons oder tippe direkt die Zahl ein. Max Teams = 26 (A–Z).
        </div>
    </div>

    <div class="card aside">
        <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <div style="font-weight:700;color:#253141;">Ergebnis</div>
                <div style="font-size:13px;color:var(--muted);">Farbig markierte Teams</div>
            </div>

            <div id="result" class="result-box">Wird generiert …</div>

            <div>
                <div style="font-size:13px;color:var(--muted);margin-bottom:8px;text-align:center;">Legende</div>
                <div class="legend" id="legend">
                    <!-- Legend items injected by JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* Team Randomizer - UI modernized
   Team colors for A, B, C remain as before (black, red, green).
*/

function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

function generateTeams() {
    const numPlayers = Math.max(1, parseInt(document.getElementById("players").value) || 1);
    const numTeams = Math.min(26, Math.max(2, parseInt(document.getElementById("teams").value) || 2));

    // Team letters A..Z
    let teamLetters = [];
    for (let i = 0; i < numTeams; i++) {
        teamLetters.push(String.fromCharCode(65 + i)); // A, B, C, ...
    }

    // Farben definieren (unverändert für A,B,C)
    let teamColors = {
        "A": "black",
        "B": "red",
        "C": "green"
    };

    // Ab Team D → zufällige Farben
    for (let i = 3; i < numTeams; i++) {
        teamColors[String.fromCharCode(65 + i)] = getRandomColor();
    }

    // Gleichmäßige Verteilung der Spieler auf Teams
    let distribution = [];
    for (let i = 0; i < numPlayers; i++) {
        distribution.push(teamLetters[i % numTeams]);
    }

    // Zufällig mischen (Fisher–Yates)
    for (let i = distribution.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
    }

    // Ausgabe farbig rendern
    let html = "";
    distribution.forEach(team => {
        const color = teamColors[team] || getRandomColor();
        html += `<span class=\"team\" style=\"background:${color}\">${team}</span>`;
    });

    document.getElementById("result").innerHTML = html;

    // Update legend (show all teams with their colors)
    renderLegend(teamColors, teamLetters);
}

function renderLegend(teamColors, teamLetters) {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    teamLetters.forEach(letter => {
        const color = teamColors[letter] || "#888";
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<div class=\"legend-color\" style=\"background:${color}\"></div><div style=\"font-weight:600;\">${letter}</div>`;
        legend.appendChild(item);
    });
}

// Steppers (+ / -) Funktionalität
document.querySelectorAll('.stepper button').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const targetId = btn.getAttribute('data-target');
        const action = btn.getAttribute('data-action');
        const el = document.getElementById(targetId);
        if (!el) return;
        const step = parseInt(el.step) || 1;
        let val = parseInt(el.value) || 0;
        if (action === 'inc') val += step;
        else val -= step;
        if (el.hasAttribute('min')) val = Math.max(parseInt(el.getAttribute('min')), val);
        if (el.hasAttribute('max')) val = Math.min(parseInt(el.getAttribute('max')), val);
        el.value = val;
        generateTeams();
    });
});

// Buttons
document.getElementById('regen').addEventListener('click', generateTeams);
document.getElementById('shuffle').addEventListener('click', generateTeams);

// Also regenerieren bei direkter Eingabe
document.getElementById("players").addEventListener("input", generateTeams);
document.getElementById("teams").addEventListener("input", generateTeams);

// Initial
generateTeams();
</script>

</body>
</html>
