<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Randomizer</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background: #eef2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header {
        width: 100%;
        padding: 25px 0;
        text-align: center;
        background: linear-gradient(135deg, #2c3e50, #4ca1af);
        color: white;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 30px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .container {
        width: 360px;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
    }

    label {
        font-weight: 600;
        margin-bottom: 6px;
        color: #333;
    }

    .input-group {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #d0d7de;
        font-size: 16px;
        transition: 0.2s;
        outline: none;
    }

    input:focus {
        border-color: #4ca1af;
        box-shadow: 0 0 6px rgba(76,161,175,0.5);
    }

    .result-box {
        margin-top: 10px;
        padding: 20px;
        background: #f7fbff;
        border: 1px solid #c9e6ff;
        border-radius: 12px;
        text-align: center;
        min-height: 50px;
    }

    .team {
        display: inline-block;
        padding: 5px 9px;
        margin: 4px;
        border-radius: 6px;
        color: white;
        font-weight: 700;
        font-size: 18px;
    }
</style>
</head>

<body>

<header>Team Randomizer</header>

<div class="container">

    <div class="input-group">
        <label>Anzahl Spieler</label>
        <input type="number" id="players" value="10" min="1">
    </div>

    <div class="input-group">
        <label>Anzahl Teams</label>
        <input type="number" id="teams" value="2" min="2">
    </div>

    <div class="result-box" id="result">Wird generiert …</div>

</div>

<script>
// Zufällige Farbe für Teams ab D
function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}

function generateTeams() {
    const numPlayers = parseInt(document.getElementById("players").value);
    const numTeams = parseInt(document.getElementById("teams").value);

    let teamLetters = [];
    for (let i = 0; i < numTeams; i++) {
        teamLetters.push(String.fromCharCode(65 + i)); // A, B, C...
    }

    // Fest definierte Farben
    let teamColors = {
        "A": "black",
        "B": "red",
        "C": "green"
    };

    // Für Teams ab D → zufällige Farben
    for (let i = 3; i < numTeams; i++) {
        teamColors[String.fromCharCode(65 + i)] = getRandomColor();
    }

    let distribution = [];

    // Gleichmäßige Verteilung
    for (let i = 0; i < numPlayers; i++) {
        distribution.push(teamLetters[i % numTeams]);
    }

    // Fisher-Yates Shuffle
    for (let i = distribution.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
    }

    // Farbig darstellen
    let html = "";
    distribution.forEach(team => {
        html += `<span class="team" style="background:${teamColors[team]}">${team}</span>`;
    });

    document.getElementById("result").innerHTML = html;
}

// Neue Ausgabe bei Eingaben
document.getElementById("players").addEventListener("input", generateTeams);
document.getElementById("teams").addEventListener("input", generateTeams);

// Erste Ausgabe
generateTeams();
</script>

</body>
</html>
